
<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#004d40" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/8212/8212613.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>MANGO TOUR - 베트남 골프 투어 전문</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              gold: {
                400: '#D4AF37',
                500: '#C5A028',
                600: '#B4901C',
              },
              deepgreen: '#004d40',
            },
            screens: {
              'xs': '375px',
            }
          }
        }
      }
    </script>
    <script src="https://apis.google.com/js/api.js" async defer></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap');
      :root {
        --sat: env(safe-area-inset-top, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
        --sal: env(safe-area-inset-left, 0px);
        --sar: env(safe-area-inset-right, 0px);
      }
      * {
        box-sizing: border-box;
      }
      body {
        font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
        overscroll-behavior-y: none;
      }
      /* Prevent iOS font auto-zoom in form controls */
      input, select, textarea {
        font-size: 16px !important;
      }
      @media (min-width: 768px) {
        input, select, textarea {
          font-size: 14px !important;
        }
      }
      /* Safe area utilities */
      .pb-safe {
        padding-bottom: calc(4.5rem + env(safe-area-inset-bottom, 0px));
      }
      .pt-safe {
        padding-top: env(safe-area-inset-top, 0px);
      }
      .bottom-safe {
        bottom: env(safe-area-inset-bottom, 0px);
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f1f1; 
      }
      ::-webkit-scrollbar-thumb {
        background: #888; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #555; 
      }

      /* Print Styles for PDF Generation */
      @media print {
        @page {
          margin: 10mm;
          size: A4;
        }
        body * {
          visibility: hidden;
        }
        .printable-area, .printable-area * {
          visibility: visible;
        }
        .printable-area {
          width: 100%;
          height: auto;
          margin: 0;
          padding: 10mm !important; /* Reduced padding for print */
          background: white !important;
          box-shadow: none !important;
          overflow: visible !important;
          border-radius: 0 !important;
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
        }
        .no-print {
          display: none !important;
        }
        ::-webkit-scrollbar {
          display: none;
        }
        .break-inside-avoid {
          break-inside: avoid;
        }
      }

      @keyframes fade-in-up {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes scale-in {
        from { opacity: 0; transform: scale(0.95); }
        to { opacity: 1; transform: scale(1); }
      }
      .animate-fade-in-up {
        animation: fade-in-up 0.4s ease-out forwards;
      }
      .animate-fade-in {
        animation: fade-in 0.3s ease-out forwards;
      }
      .animate-scale-in {
        animation: scale-in 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="error-console" style="display: none; padding: 20px; background: #fff0f0; color: #ff0000; border: 2px solid #ff0000; margin: 20px; border-radius: 8px; font-family: monospace; white-space: pre-wrap; font-size: 14px; position: fixed; bottom: 0; left: 0; right: 0; z-index: 999999; word-break: break-all; max-height: 40vh; overflow-y: auto;"><strong>JavaScript Runtime Error Catcher:</strong></div>
    <script>
      window.addEventListener('error', function(e) {
        var consoleDiv = document.getElementById('error-console');
        if (consoleDiv) {
          consoleDiv.style.display = 'block';
          consoleDiv.innerText += '\nError: ' + e.message + ' at ' + e.filename + ':' + e.lineno;
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        var consoleDiv = document.getElementById('error-console');
        if (consoleDiv) {
          consoleDiv.style.display = 'block';
          consoleDiv.innerText += '\nUnhandled Rejection: ' + (e.reason?.message || e.reason || 'Unknown rejection');
        }
      });
    </script>
    <script type="module" src="/index.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (let registration of registrations) {
            registration.unregister().then(function() {
              console.log('ServiceWorker unregistered successfully in Dev');
            });
          }
        });
        caches.keys().then(function(names) {
          for (let name of names) {
            caches.delete(name);
          }
        });
      }
    </script>
  </body>
</html>
